{% extends 'base.html' %}{% block title %}Edit product{% endblock %}{% block section %}Products{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">Catalog / edit</div><h1>Edit product</h1><p>Update the catalog record; existing sales keep their original recorded prices and names.</p></div><a class="btn btn-outline" href="{{ url_for('product.products') }}"><i class="bi bi-arrow-left"></i> Back</a></div>
<section class="panel" style="max-width:900px"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid">
<div class="form-field"><label class="form-label" for="name">Product name</label><input class="form-control" id="name" name="name" maxlength="150" value="{{ product.product_name }}" required></div>
<div class="form-field"><label class="form-label" for="product_id">Product ID / SKU</label><input class="form-control" id="product_id" name="product_id" maxlength="64" value="{{ product.product_id or '' }}"></div>
<div class="form-field"><label class="form-label" for="category">Category</label><input class="form-control" id="category" name="category" maxlength="100" value="{{ product.category }}" required></div>
<div class="form-field"><label class="form-label" for="selling_price">Selling price (Rs.)</label><input class="form-control" id="selling_price" name="selling_price" type="number" step="0.01" min="0" value="{{ product.selling_price if product.selling_price is defined else product.price }}" required></div>
<div class="form-field"><label class="form-label" for="cost_price">Unit cost (Rs.)</label><input class="form-control" id="cost_price" name="cost_price" type="number" step="0.01" min="0" value="{{ product.cost_price|default(0) }}"></div>
<div class="form-field"><label class="form-label" for="quantity">Available quantity</label><input class="form-control" id="quantity" name="quantity" type="number" min="0" value="{{ product.available_quantity|default(0) }}" required></div>
<div class="form-field"><label class="form-label" for="reorder_level">Low-stock threshold</label><input class="form-control" id="reorder_level" name="reorder_level" type="number" min="0" value="{{ product.reorder_level|default(5) }}"></div>
<div class="form-field"><label class="form-label" for="discount_percentage">Default discount (%)</label><input class="form-control" id="discount_percentage" name="discount_percentage" type="number" min="0" max="100" step="0.01" value="{{ product.discount_percentage|default(0) }}"></div>
<div class="form-field full"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="4">{{ product.description|default('') }}</textarea></div></div><div class="form-actions"><button class="btn btn-primary"><i class="bi bi-check2"></i> Save changes</button><a class="btn btn-outline" href="{{ url_for('product.products') }}">Cancel</a></div></form></section>{% endblock %}
