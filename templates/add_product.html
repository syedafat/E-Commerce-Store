{% extends 'base.html' %}{% block title %}Add product{% endblock %}{% block section %}Products{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">Catalog</div><h1>Add product</h1><p>Create a catalog record that is immediately available to inventory and sales.</p></div><a class="btn btn-outline" href="{{ url_for('product.products') }}"><i class="bi bi-arrow-left"></i> Back to products</a></div>
<section class="panel" style="max-width:900px"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid">
<div class="form-field"><label class="form-label" for="product_name">Product name</label><input class="form-control" id="product_name" name="product_name" maxlength="150" required></div>
<div class="form-field"><label class="form-label" for="product_id">Product ID / SKU <span class="muted">(optional)</span></label><input class="form-control" id="product_id" name="product_id" maxlength="64" placeholder="e.g. MUG-001"></div>
<div class="form-field"><label class="form-label" for="category">Category</label><input class="form-control" id="category" name="category" maxlength="100" required></div>
<div class="form-field"><label class="form-label" for="selling_price">Selling price (Rs.)</label><input class="form-control" id="selling_price" name="selling_price" type="number" step="0.01" min="0" required></div>
<div class="form-field"><label class="form-label" for="cost_price">Unit cost (Rs.)</label><input class="form-control" id="cost_price" name="cost_price" type="number" step="0.01" min="0" value="0"></div>
<div class="form-field"><label class="form-label" for="available_quantity">Opening stock</label><input class="form-control" id="available_quantity" name="available_quantity" type="number" min="0" step="1" value="0" required></div>
<div class="form-field"><label class="form-label" for="reorder_level">Low-stock threshold</label><input class="form-control" id="reorder_level" name="reorder_level" type="number" min="0" step="1" value="5"></div>
<div class="form-field"><label class="form-label" for="discount_percentage">Default discount (%)</label><input class="form-control" id="discount_percentage" name="discount_percentage" type="number" min="0" max="100" step="0.01" value="0"></div>
<div class="form-field full"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="4" maxlength="2000"></textarea></div></div><div class="form-actions"><button class="btn btn-primary"><i class="bi bi-check2"></i> Save product</button><a class="btn btn-outline" href="{{ url_for('product.products') }}">Cancel</a></div></form></section>{% endblock %}
